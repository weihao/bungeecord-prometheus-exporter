name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 4.0.0. Leave blank to use the POM version as-is.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set the release version
        if: inputs.version != ''
        run: mvn -B --no-transfer-progress versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Pre-pull container images
        run: |
          docker pull itzg/mc-proxy:latest
          docker pull prom/prometheus:v3.7.3

      # A release is the one build that must never skip the end-to-end suite: it is the
      # only thing that proves the artifact being published actually loads on a proxy.
      - name: Build and verify
        run: mvn -B --no-transfer-progress clean verify

      - name: Collect the artifact
        id: artifact
        run: |
          JAR=$(ls exporter-dist/target/bungeecord-prometheus-exporter-*.jar)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR" | awk '{print $1}' > "$JAR.sha256"
          echo "Built $JAR"

      - name: Attach the jar to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
            dashboards/proxy-overview.json

      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        run: mvn -B --no-transfer-progress deploy -DskipTests -DskipITs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
