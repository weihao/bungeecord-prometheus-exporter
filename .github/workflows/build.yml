name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the compile target and the minimum any supported proxy runs on.
        # 21 and 25 are what Velocity 3.5 and 4.x run on, so the same artifact is
        # exercised on every JVM it will actually meet in production.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Unit tests and package
        run: mvn -B --no-transfer-progress clean package

      - name: Verify the jar is Java 17 bytecode and carries both descriptors
        run: |
          JAR=$(ls exporter-dist/target/bungeecord-prometheus-exporter-*.jar)
          echo "Checking $JAR"
          unzip -l "$JAR" | grep -q ' bungee.yml' || { echo "::error::bungee.yml missing"; exit 1; }
          unzip -l "$JAR" | grep -q ' velocity-plugin.json' || { echo "::error::velocity-plugin.json missing"; exit 1; }
          unzip -l "$JAR" | grep -q ' config.yml' || { echo "::error::config.yml missing"; exit 1; }
          # Nothing may remain at an unrelocated library package.
          if unzip -l "$JAR" | grep -qE ' (io/prometheus|org/yaml|org/bstats)/'; then
            echo "::error::a bundled library was not relocated"
            unzip -l "$JAR" | grep -E ' (io/prometheus|org/yaml|org/bstats)/' | head
            exit 1
          fi

      - name: Upload the plugin jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: bungeecord-prometheus-exporter
          path: exporter-dist/target/bungeecord-prometheus-exporter-*.jar
          if-no-files-found: error

  end-to-end:
    name: End-to-end (real proxies in Docker)
    runs-on: ubuntu-latest
    # Boots Velocity, BungeeCord and Waterfall containers and validates the exposition
    # with the real promtool, so give it room.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Pre-pull container images
        run: |
          docker pull itzg/mc-proxy:latest
          docker pull prom/prometheus:v3.7.3

      - name: mvn verify
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: exporter-dist/target/failsafe-reports/
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: mvn verify -Pcoverage
        run: mvn -B --no-transfer-progress clean test -Pcoverage -DskipITs

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore

  docs:
    name: Generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # docs/METRICS.md is generated from a live scrape and the dashboard is generated
      # from a script. Both are committed, so both must match what the code produces.
      - name: Regenerate the metric reference and the dashboard
        run: |
          mvn -B --no-transfer-progress -pl exporter-core -am test \
            -Dtest=MetricCatalogTest -DfailIfNoTests=false -Dmetrics.catalog.write=true
          python dashboards/build_dashboard.py

      - name: Fail if anything is out of date
        run: |
          if ! git diff --quiet -- docs/METRICS.md dashboards/proxy-overview.json; then
            echo "::error::generated files are out of date. Run:"
            echo "  mvn -pl exporter-core test -Dtest=MetricCatalogTest -Dmetrics.catalog.write=true"
            echo "  python dashboards/build_dashboard.py"
            git --no-pager diff -- docs/METRICS.md dashboards/proxy-overview.json
            exit 1
          fi
